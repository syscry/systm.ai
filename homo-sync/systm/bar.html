  <style>html, body { background: transparent !important; overflow: hidden; }
  /* the poem's own face, so the contract is set in the same type as the work.
     The bar is an iframe at /homo-sync/systm/, so the files are one level up. */
  @font-face { font-family:"SYS Light"; src:url("../fonts/sys-dots-light.woff") format("woff"); font-weight:300; font-display:block; }
  .sys-contract { font-family:"SYS Light", ui-monospace, Menlo, monospace;
    font-size:11px; letter-spacing:.14em; color:#bdbdbd; text-decoration:none;
    white-space:nowrap; text-transform:lowercase; }
  /* Seven hairlines driven by the poem. They move from the moment the page opens, on
     an uneven silhouette rather than a tidy arc, and swing wider while a word is spoken. Clicking starts and stops the reading. */
  .sys-wave { display:flex; align-items:center; gap:2.2px; height:18px; cursor:pointer;
    pointer-events:auto; }
  .sys-wave i { display:block; width:1.4px; border-radius:1px; background:#cfcfcf;
    transition:background .3s ease; }
  .sys-wave:hover i, .sys-wave:focus-visible i { background:#9a9a9a; }
  .sys-wave:focus { outline:none; }
  /* the mark sat between a 24px logo and a right-hand block of a different width,
     inside justify-content:space-between, so its centre landed 8.3px left of the
     bar's. Centred against the bar itself it cannot drift when either side
     changes width again. */
  .top-footer { position:relative; }
  /* .top-footer is padded 20px at the top and 0 at the bottom, so its box centre is
     10px above where the logo and the contract actually sit. Centring on 50% of the
     box put the mark there too. Stretch it across the box instead and centre inside
     the padding, which lands on the same line as everything else, and keeps doing so
     if the bar padding ever changes. */
  #homomark { position:absolute !important; left:50% !important;
    top:0 !important; bottom:0 !important; transform:translateX(-50%) !important;
    margin:0 !important; padding-top:inherit !important; padding-bottom:inherit !important;
    display:flex !important; align-items:center !important; }</style>

<script>
(function () {
  // The bar is a same-origin iframe, so it can read the page directly. The page has no
  // analyser, and adding one would mean routing the poem through a Web Audio graph,
  // which can silence it if anything goes wrong. The page already marks the word being
  // spoken with .w.lit, so the bars are driven from that: real, from the poem, and it
  // cannot break playback.
  var w = document.getElementById('syswave');
  var bars = [].slice.call(w.children);
  // An uneven silhouette, not a symmetric arc: a neat curve reads as an icon, this
  // reads as sound. Each bar also carries a slow drift of its own, so the shape keeps
  // rearranging instead of holding one pose.
  var BASE  = [6, 12.5, 8, 4.5, 14, 9, 11];
  var SPEED = [5.1, 7.3, 4.3, 8.9, 3.7, 6.7, 5.9];   // primes, so they never line up
  var DRIFT = [0.31, 0.47, 0.23, 0.53, 0.19, 0.41, 0.29];
  var PHASE = [0, 1.1, 2.3, 0.7, 1.9, 2.8, 1.5];
  var env = 0, kick = new Array(7).fill(0.8), lastWord = null;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function page() { try { return parent.document; } catch (e) { return null; } }

  function frame(ts) {
    var d = page(), t = ts / 1000, lit = null, playing = false;
    if (d) {
      lit = d.querySelector('#poem .w.lit');
      var a = d.querySelector('audio');
      playing = !!a && !a.paused && !a.ended;
    }
    // every new word strikes, and each bar gets its own share of the strike so the
    // group does not move as one block
    if (lit && lit !== lastWord) {
      env = 1; lastWord = lit;
      for (var k = 0; k < 7; k++) kick[k] = 0.55 + Math.random() * 0.75;
    }
    if (!lit) lastWord = null;
    env = lit ? Math.max(env * 0.90, 0.46) : env * 0.86;   // sharper than before, so a word reads as a hit
    if (!playing) env = 0;      // the word envelope only; the idle motion above never stops

    for (var i = 0; i < bars.length; i++) {
      // it breathes even before the poem starts, so the corner is alive on the start
      // screen; a word only widens and quickens what is already happening
      var osc = still ? 0.5 : Math.abs(Math.sin(t * SPEED[i] * (0.42 + 0.58 * env) + PHASE[i]));
      var drift = still ? 0 : Math.sin(t * DRIFT[i] + PHASE[i] * 2) * 1.7;
      // idle stays a breath, not a performance, so a spoken word still reads as
      // a clear step up rather than more of the same
      var h = (BASE[i] + drift) * (1 - 0.30 * env) + (1.7 + env * kick[i] * 13) * osc;
      bars[i].style.height = Math.max(2.5, Math.min(18, h)).toFixed(1) + 'px';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function toggle() { try { parent.toggle(); } catch (e) { } }
  w.addEventListener('click', toggle);
  w.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
})();
</script>
