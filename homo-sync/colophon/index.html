<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>homo:sync — the 33 works</title>
<link rel="icon" href="../favicon.png">
<style>
  :root { --ink:#111; --dim:#9b9b9b; --bg:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; -webkit-font-smoothing:antialiased; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  #wrap { width:100%; max-width:1180px; padding:3vh 12px 2vh; }
  svg { width:100%; height:auto; display:block; overflow:visible; }
  text { fill:var(--ink); font-size:10.1px; letter-spacing:.055em; white-space:pre; }
  .ln, .br, .pw, .ft { opacity:0; animation:in 1.5s ease forwards; animation-delay:var(--d,0s); }
  @keyframes in { to { opacity:1; } }
  .ft { text-anchor:middle; font-size:10.1px; }
  a text.ft { cursor:pointer; }
  a:hover text.ft { fill:#000; text-decoration:underline; text-underline-offset:3px; }
  circle.bd, circle.pd { fill:var(--ink); }
  .hit { fill:transparent; pointer-events:all; }
  .wk { cursor:pointer; }
  svg.live .wk { transition:opacity .45s ease; }
  svg.live:hover .wk { opacity:.22; }
  svg.live:hover .wk:hover, svg.live .wk.on { opacity:1; }
  .wk:hover text, .wk.on text { fill:#000; }
  .pw { transition:opacity .5s ease; }
  .pw:hover circle { fill:#000; }
  svg.live:hover .pw { opacity:.35; }
  #peek { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none;
    opacity:0; transition:opacity .5s ease; z-index:4; text-align:center; }
  #peek img { width:118px; height:auto; display:block; box-shadow:0 12px 46px #0000001f; }
  #peek span { display:block; margin-top:.9em; font-size:10px; letter-spacing:.18em; color:var(--dim); }
  #peek.on { opacity:1; }
  #view { position:fixed; inset:0; background:#fffffff2; display:none; z-index:9;
    flex-direction:column; align-items:center; justify-content:center; gap:2.2vh; padding:4vh 16px; }
  #view.on { display:flex; }
  #view img { max-height:66vh; max-width:min(92vw,520px); width:auto; box-shadow:0 18px 70px #00000022; }
  #view .cap { font-size:11px; letter-spacing:.16em; color:#555; text-align:center; line-height:2; }
  #view .cap b { font-weight:400; color:#111; }
  #view a { color:#111; text-decoration:none; border-bottom:1px solid #d5d5d5; }
  #view a:hover { border-color:#111; }
  #view .x { position:fixed; top:18px; right:22px; font-size:11px; letter-spacing:.2em; color:#888; cursor:pointer; }
  #hint { display:none; font-size:9.5px; letter-spacing:.2em; color:var(--dim); text-align:center; padding:0 0 1vh; }
  #foot { font-size:10px; letter-spacing:.2em; color:var(--dim); padding:1vh 0 5vh; text-align:center; }
  #foot a { color:inherit; text-decoration:none; border-bottom:1px solid #e2e2e2; }
  #foot a:hover { color:#111; }
  @media (max-width:860px) {            /* a ring this dense cannot shrink to a phone: let it be panned instead */
    #wrap { padding:2vh 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    svg { width:880px; max-width:none; }
    #peek img { width:92px; }
    #hint { display:block; }
  }
  @media (prefers-reduced-motion:reduce) { .ln,.br,.pw,.ft { animation:none; opacity:1; } #ring { animation:none !important; } }
</style></head>

<script>
(() => {
  const svg = document.getElementById('svg'), peek = document.getElementById('peek');
  const pimg = document.getElementById('peekimg'), pcap = document.getElementById('peekcap');
  const view = document.getElementById('view'), vimg = document.getElementById('vimg'), vcap = document.getElementById('vcap');
  const CONTRACT = '0x36527922409be04fc8146ee03a5d42901f5a9f4f', OPENSEA = 'https://opensea.io/assets/ethereum/0x36527922409be04fc8146ee03a5d42901f5a9f4f/', METABASE = 'https://arweave.net/Ga0ADlLf3oo2rgGxfk2Guh8rmTL6zq9CYd5qf0GlxRs/';
  const pad = n => String(n).padStart(2, '0');
  setTimeout(() => svg.classList.add('live'), 2600);           // let the sweep finish before anything dims
  for (const g of document.querySelectorAll('.wk')) {
    const w = +g.dataset.w, t = +g.dataset.t;
    g.addEventListener('mouseenter', () => {
      pimg.src = '../works/t' + pad(w) + '.webp';
      pcap.textContent = 'homo:sync ' + pad(w) + '  \u00b7  token ' + pad(t);
      peek.classList.add('on');
    });
    g.addEventListener('mouseleave', () => peek.classList.remove('on'));
    g.addEventListener('click', () => {
      vimg.src = '../works/' + pad(w) + '.webp';
      vcap.innerHTML = '<b>homo:sync ' + pad(w) + '</b><br>token ' + pad(t) + ' of 33<br>' +
        g.dataset.kb + ' kb \u00b7 1000 \u00d7 1500 px \u00b7 png<br>' +
        '<a href="' + OPENSEA + t + '" target="_blank" rel="noopener">opensea</a> \u00b7 ' +
        '<a href="https://arweave.net/' + g.dataset.tx + '" target="_blank" rel="noopener">the image on arweave</a> \u00b7 ' +
        '<a href="' + METABASE + t + '" target="_blank" rel="noopener">metadata</a>';
      view.classList.add('on'); peek.classList.remove('on');
    });
  }
  const close = () => view.classList.remove('on');
  view.addEventListener('click', e => { if (!e.target.closest('a') || e.target.classList.contains('x')) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  for (const g of document.querySelectorAll('.pw')) {          // a word of the poem, in braille
    g.addEventListener('mouseenter', () => { pcap.textContent = g.dataset.word; pimg.removeAttribute('src'); peek.classList.add('on'); });
    g.addEventListener('mouseleave', () => peek.classList.remove('on'));
  }
})();
</script>
